name: Convert trip photos

# Turns photos/videos uploaded into thanksgivingtrip/photos/<id>/ into web-ready, metadata-free files and
# rebuilds photos/manifest.json. The work is in thanksgivingtrip/tools/process_photos.py (shared with
# tools/add-photos.sh for running it locally).
on:
  push:
    branches: [main]
    paths: ['thanksgivingtrip/photos/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-photos
  cancel-in-progress: false

jobs:
  convert:
    # Its own "Convert trip photos" commit must never start another run.
    if: github.actor != 'github-actions[bot]' && github.event.pusher.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg, libheif, exiftool, Pillow, gpxpy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libheif-examples libimage-exiftool-perl
          pip install -q pillow gpxpy

      # GPX uploads become route.json (and the .gpx is deleted in the same commit). HOME_LATLON ("lat, lon", a repo
      # secret) cuts any track points within 5 km of home; without it, only the 250 m end trims apply.
      - name: Convert, pair, strip metadata, process routes, rebuild manifest
        env:
          HOME_LATLON: ${{ secrets.HOME_LATLON }}
        run: python thanksgivingtrip/tools/process_photos.py

      - name: Commit results
        run: |
          git add -A thanksgivingtrip/photos
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Convert trip photos"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
