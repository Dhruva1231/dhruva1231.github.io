name: Render schedule wallpaper
on:
  workflow_dispatch:
    inputs:
      schedule:
        description: "schedule.txt contents"
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Write schedule.txt
        env:
          SCHEDULE: ${{ inputs.schedule }}
        run: printf '%s' "$SCHEDULE" > tools/schedule/schedule.txt
      - name: Render
        run: cd tools/schedule && python render_local.py
      - name: Commit PNGs
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/schedule/schedule.png tools/schedule/schedule_tomorrow.png
          git commit -m "render $(date -u +%FT%TZ)" || echo "no changes"
          git push
