<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Journey</title>
<style>
:root{--ink:#eef1f6;--dim:#8b93a7;--bg:#05070d;--panel:rgba(14,18,30,.72);--line:rgba(255,255,255,.09);
--family:#ffb86b;--hiking:#5fe0a0;--competition:#ff6b8b;--college:#7aa8ff;--visiting:#d59bff;--other:#cfd6e4}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden}
#sky,#globe{position:fixed;inset:0;width:100%;height:100%}
#globe{cursor:grab}#globe:active{cursor:grabbing}
header{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
h1{margin:0;font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;color:var(--dim)}
.stats{display:flex;gap:22px;margin-top:10px}.stat b{display:block;font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
.controls{display:flex;gap:8px;pointer-events:auto}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;backdrop-filter:blur(10px)}
button:hover{border-color:rgba(255,255,255,.3)}button:focus-visible{outline:2px solid #7aa8ff;outline-offset:2px}
#card{position:fixed;right:22px;top:110px;width:min(400px,calc(100vw - 44px));background:var(--panel);border:1px solid var(--line);
border-radius:18px;padding:18px 20px;backdrop-filter:blur(14px);z-index:4;transition:opacity .5s,transform .5s}
#card.hide{opacity:0;transform:translateY(8px)}
.chip{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:999px;border:1px solid currentColor;margin-right:6px}
#card h2{margin:10px 0 2px;font-size:24px;line-height:1.15;letter-spacing:-.01em}
#card .when{color:var(--dim);font-size:13px}
#card .places{margin:12px 0 0;font-size:13px}#card .places span{color:var(--dim)}
#card .kw{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}#card .kw i{font-style:normal;font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:6px}
#route{display:block;width:100%;height:120px;margin-top:14px;border-top:1px solid var(--line)}
#board{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.pol{position:absolute;width:118px;background:#f6f3ec;padding:7px 7px 22px;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.55);
pointer-events:auto;cursor:zoom-in;transition:transform .9s cubic-bezier(.2,.8,.2,1),left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ccc}
.pol .d{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:11px "Marker Felt","Bradley Hand",cursive;color:#3a3a3a}
.pol .v{position:absolute;top:12px;right:12px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 5px}
.pol:hover{z-index:9!important;transform:rotate(0) scale(1.12)!important}
#tl{position:fixed;left:22px;right:22px;bottom:18px;height:64px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
#tl canvas{width:100%;height:100%;display:block;cursor:pointer}
#tip{position:fixed;z-index:20;pointer-events:none;background:#0d1120;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;display:none;white-space:nowrap}
#lb{position:fixed;inset:0;z-index:30;background:rgba(3,5,10,.86);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;cursor:zoom-out}
#lb img{max-width:min(90vw,520px);max-height:70vh;border:8px solid #f6f3ec;border-bottom-width:36px;box-shadow:0 20px 60px #000}
#lb p{max-width:520px;text-align:center;color:var(--dim);margin:0}
@media (max-width:760px){header{flex-direction:column;gap:10px}.stats{gap:14px}.stat b{font-size:19px}
#card{top:auto;bottom:92px;right:16px;left:16px;width:auto;padding:14px}#card h2{font-size:19px}#route{height:70px}
.pol{width:84px;padding:5px 5px 16px}.pol .d{font-size:9px;bottom:2px}#tl{left:16px;right:16px;height:54px}header{left:16px;right:16px}}

#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
background:radial-gradient(ellipse at center,#0c1428,#04060b)}
#lock form{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
#lock h1{font-size:15px;color:var(--ink)}#lock p{margin:0;color:var(--dim);font-size:13px}
#lock input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--ink);
font:600 22px/1 -apple-system,sans-serif;letter-spacing:.4em;text-align:center;padding:12px 10px;width:200px}
#lock input:focus{outline:2px solid #7aa8ff;outline-offset:2px}
#lock .err{color:#ff6b8b;min-height:18px}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="lock"><form><h1>Journey</h1><p>Enter the code</p>
<input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus aria-label="Code">
<button type="submit">Open</button><p class="err" id="err"></p></form></div>
<canvas id="sky"></canvas><canvas id="globe" aria-label="Globe showing trips. Drag to turn."></canvas>
<div id="board"></div>
<header><div><h1>Journey</h1>
<div class="stats"><div class="stat"><b id="sTrips">0</b><span>trips</span></div><div class="stat"><b id="sPhotos">0</b><span>photos</span></div>
<div class="stat"><b id="sKm">0</b><span>km away</span></div><div class="stat"><b id="sC">0</b><span>countries</span></div></div></div>
<div class="controls"><button id="prev" aria-label="Previous trip">◀</button><button id="play">▶ Play</button><button id="next" aria-label="Next trip">▶▶</button><button id="all">All</button></div></header>
<div id="card" class="hide"></div>
<div id="tl"><canvas id="tlc"></canvas></div>
<div id="tip"></div><div id="lb"><img alt=""><p></p></div>

 // current arc + route
 if(cur>=0&&!showAll){const t=T[cur];arcT=Math.min(1,arcT+.012);const pts=arcPts(t,ease(arcT));strokeArc(pts,col(t.type),2.4,.95);
  const head=pts[pts.length-1];if(head&&arcT<1){g.fillStyle='#fff';g.beginPath();g.arc(head.x,head.y,3.2,0,7);g.fill();}
  if(arcT>=1){routeT=Math.min(1,routeT+.01);const n=Math.max(2,Math.ceil(t.route.length*routeT));g.strokeStyle='#fff';g.lineWidth=1.4;g.globalAlpha=.85;g.beginPath();
   t.route.slice(0,n).forEach(([la,lo],i)=>{const p=proj(la,lo);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.stroke();g.globalAlpha=1;}}
 // homes
 for(const h of DATA.homes){const p=proj(h.lat,h.lon);if(p.v<=0)continue;g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(p.x,p.y,9,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill();g.font='600 10px -apple-system,sans-serif';g.fillStyle='rgba(255,255,255,.75)';g.fillText(h.label.toUpperCase(),p.x+8,p.y-6);}
 // pins
 pinHits=[];T.forEach((t,i)=>{if(!showAll&&i>cur)return;const p=proj(t.lat,t.lon);if(p.v<=0)return;const on=i===cur;
  const pulse=on?4+3*Math.sin(now/220):0;g.fillStyle=col(t.type);g.globalAlpha=on?.25:.0;g.beginPath();g.arc(p.x,p.y,8+pulse,0,7);g.fill();g.globalAlpha=1;
  g.beginPath();g.arc(p.x,p.y,on?4.5:3,0,7);g.fill();pinHits.push({x:p.x,y:p.y,i});});
 drawRouteInset();
 requestAnimationFrame(draw);}
let pinHits=[];const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

// ---------- card + polaroids ----------
const card=document.getElementById('card'),board=document.getElementById('board');
const fmt=s=>new Date(s+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
function km(t){const a=vec(t.home.lat,t.home.lon),b=vec(t.lat,t.lon);return 6371*Math.acos(Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])));}
function showCard(t){const c=col(t.type);const span=t.start===t.end?fmt(t.start):fmt(t.start)+' – '+fmt(t.end);
 card.innerHTML=`<span class="chip" style="color:${c}">${t.type}</span><span class="chip" style="color:var(--dim)">${t.cat}</span>
 <h2>${esc(t.title)}</h2><div class="when">${span} · ${t.days} day${t.days>1?'s':''} · ${t.count} photos${t.videos?` · ${t.videos} videos`:''}</div>
 ${t.series?`<div class="when" style="margin-top:4px;color:${c}">↻ ${esc(t.series)}</div>`:''}
 <div class="places">${t.places.map(p=>`${esc(p.name)} <span>${esc(p.region)}</span>`).join(' → ')}</div>
 <div class="when" style="margin-top:6px">${Math.round(km(t)).toLocaleString()} km from ${esc(t.home.label)}</div>
 <div class="kw">${[...t.acts,...t.kw].slice(0,8).map(k=>`<i>${esc(k)}</i>`).join('')}</div><canvas id="route"></canvas>`;
 card.classList.remove('hide');}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function drawRouteInset(){const c=document.getElementById('route');if(!c||cur<0||showAll)return;const t=T[cur];const w=c.clientWidth,h=c.clientHeight;
 if(c.width!==w*DPR){c.width=w*DPR;c.height=h*DPR;}const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,w,h);
 const pts=t.route;if(pts.length<2){x.fillStyle=css('--dim');x.font='12px sans-serif';x.fillText('one location',8,h/2);return;}
 const k=Math.cos(t.lat*D2R);let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;for(const[la,lo]of pts){const X=lo*k,Y=-la;mnx=Math.min(mnx,X);mxx=Math.max(mxx,X);mny=Math.min(mny,Y);mxy=Math.max(mxy,Y);}
 const s=Math.min((w-24)/Math.max(1e-4,mxx-mnx),(h-24)/Math.max(1e-4,mxy-mny)),ox=(w-(mxx-mnx)*s)/2,oy=(h-(mxy-mny)*s)/2;
 const P=([la,lo])=>[ox+(lo*k-mnx)*s,oy+(-la-mny)*s];const n=Math.max(2,Math.ceil(pts.length*(arcT>=1?routeT:0)));
 x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;x.beginPath();pts.forEach((p,i)=>{const[a,b]=P(p);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();
 x.strokeStyle=col(t.type);x.lineWidth=2;x.lineJoin='round';x.beginPath();pts.slice(0,n).forEach((p,i)=>{const[a,b]=P(p);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();
 const[ex,ey]=P(pts[n-1]);x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,3,0,7);x.fill();
 x.fillStyle=css('--dim');x.font='10px sans-serif';x.fillText('ROUTE FROM PHOTO LOCATIONS',4,11);}
function scatterSlots(n){const mobile=W<760,slots=[];const rect=card.getBoundingClientRect();
 const top=mobile?document.querySelector('.controls').getBoundingClientRect().bottom+10:document.querySelector('.stats').getBoundingClientRect().bottom+16;
 const pw=mobile?94:132,ph=mobile?110:150;
 const x0=8,x1=(mobile?W:rect.left-16)-pw,y0=top,y1=(mobile?rect.top:document.getElementById('tl').getBoundingClientRect().top)-ph+10;
 // jittered grid over the free area, filled in a shuffled order so photos land all around the globe
 const cols=Math.max(1,Math.floor((x1-x0)/(pw*.82))+1),rows=Math.max(1,Math.floor((y1-y0)/(ph*.8))+1),cells=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=x0+(cols>1?c*(x1-x0)/(cols-1):0),y=y0+(rows>1?r*(y1-y0)/(rows-1):0);
  const d=Math.hypot(x+pw/2-cx,y+ph/2-cy)/R;cells.push({x,y,k:Math.abs(d-1.05)+Math.random()*.35});}
 cells.sort((a,b)=>a.k-b.k);for(let i=0;i<n;i++){const c=cells[i%cells.length];slots.push([c.x+Math.random()*10-5,c.y+Math.random()*10-5]);}return slots;}
function dealPhotos(t){board.querySelectorAll('.pol').forEach(el=>{el.style.opacity=0;setTimeout(()=>el.remove(),600)});
 const photos=W<760?t.photos.filter((_,i)=>i%2===0||t.photos.length<=7).slice(0,7):t.photos;
 const p=proj(t.lat,t.lon),slots=scatterSlots(photos.length);
 photos.forEach((ph,i)=>{const el=document.createElement('div');el.className='pol';el.style.left=(p.x-59)+'px';el.style.top=(p.y-70)+'px';
  el.style.transform='scale(.1) rotate(0deg)';el.style.opacity=0;el.style.zIndex=i;
  el.innerHTML=`<img alt="">${ph.video?'<span class="v">▶</span>':''}<div class="d">${ph.t.slice(5,10).replace('-','/')}</div>`;
  el.onclick=()=>openLB(ph);board.appendChild(el);photo(ph.src).then(u=>el.querySelector('img').src=u);
  setTimeout(()=>{el.style.opacity=1;el.style.left=slots[i][0]+'px';el.style.top=slots[i][1]+'px';el.style.transform=`scale(1) rotate(${(Math.random()*16-8).toFixed(1)}deg)`;},900+i*110);});}
const lb=document.getElementById('lb');function openLB(ph){lb.querySelector('img').src='';photo(ph.src).then(u=>lb.querySelector('img').src=u);lb.querySelector('p').textContent=ph.t+(ph.cap?' — '+ph.cap:'');lb.style.display='flex';pause();}
lb.onclick=()=>lb.style.display='none';

// ---------- stats ----------
function stats(upto){const s=T.slice(0,upto+1);const set=(id,v)=>{const el=document.getElementById(id);const from=+el.dataset.v||0;el.dataset.v=v;
  const t0=performance.now();(function step(n){const k=Math.min(1,(n-t0)/900);el.textContent=Math.round(from+(v-from)*ease(k)).toLocaleString();if(k<1)requestAnimationFrame(step)})(t0);};
 set('sTrips',s.length);set('sPhotos',s.reduce((a,t)=>a+t.count,0));set('sKm',s.reduce((a,t)=>a+2*km(t),0));set('sC',new Set(s.flatMap(t=>t.countries)).size);}

// ---------- navigation ----------
function go(i){showAll=false;cur=(i+T.length)%T.length;const t=T[cur];arcT=0;routeT=0;
 tgt.lon=(t.lon+t.home.lon)/2;tgt.lat=(t.lat+t.home.lat)/2;tgt.zoom=1;
 setTimeout(()=>{if(T[cur]===t){tgt.lon=t.lon;tgt.lat=t.lat;tgt.zoom=W<760?1.05:1.15;}},1500);
 showCard(t);dealPhotos(t);stats(cur);tlDraw();}
function play(){playing=true;document.getElementById('play').textContent='❚❚ Pause';if(cur<0||cur>=T.length-1&&!showAll)go(0);else if(showAll)go(0);
 clearInterval(timer);timer=setInterval(()=>{if(cur>=T.length-1){pause();finale();}else go(cur+1)},6500);}
function pause(){playing=false;clearInterval(timer);document.getElementById('play').textContent='▶ Play';}
function finale(){showAll=true;cur=T.length-1;tgt.zoom=.95;board.querySelectorAll('.pol').forEach(el=>{el.style.opacity=0;setTimeout(()=>el.remove(),600)});
 card.innerHTML=`<span class="chip" style="color:var(--dim)">all of it</span><h2>${T.length} trips</h2><div class="when">${fmt(T[0].start)} – ${fmt(T[T.length-1].end)}</div>
 <div class="kw" style="margin-top:12px">${['family','hiking','competition','college','visiting','other'].map(k=>`<i style="color:${css('--'+k)}">● ${k}</i>`).join('')}</div>`;
 card.classList.remove('hide');stats(T.length-1);tlDraw();}
document.getElementById('play').onclick=()=>playing?pause():play();
document.getElementById('next').onclick=()=>{pause();go(cur+1)};document.getElementById('prev').onclick=()=>{pause();go(cur-1)};
document.getElementById('all').onclick=()=>{pause();finale()};
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();playing?pause():play()}else if(e.key==='ArrowRight'){pause();go(cur+1)}else if(e.key==='ArrowLeft'){pause();go(cur-1)}else if(e.key==='Escape')lb.style.display='none'});

// ---------- drag / click on globe ----------
let dx0,dy0,l0,p0,moved;
gc.addEventListener('pointerdown',e=>{dragging=true;moved=false;dx0=e.clientX;dy0=e.clientY;l0=tgt.lon;p0=tgt.lat;gc.setPointerCapture(e.pointerId)});
gc.addEventListener('pointermove',e=>{if(dragging){const k=90/(R*cam.zoom);if(Math.abs(e.clientX-dx0)+Math.abs(e.clientY-dy0)>4)moved=true;
  tgt.lon=l0-(e.clientX-dx0)*k;tgt.lat=Math.max(-80,Math.min(80,p0+(e.clientY-dy0)*k));cam.lon=tgt.lon;cam.lat=tgt.lat;lastInteract=performance.now();if(moved)pause();}
 else{const h=hit(e.clientX,e.clientY);tip(h!=null?T[h].title+' · '+fmt(T[h].start):null,e);}});
gc.addEventListener('pointerup',e=>{dragging=false;if(!moved){const h=hit(e.clientX,e.clientY);if(h!=null){pause();go(h)}}});
gc.addEventListener('wheel',e=>{e.preventDefault();tgt.zoom=Math.max(.7,Math.min(4,tgt.zoom*Math.exp(-e.deltaY*.0015)));},{passive:false});
function hit(x,y){let best=null,bd=14;for(const p of pinHits){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p.i}}return best;}
const tipEl=document.getElementById('tip');function tip(s,e){if(!s){tipEl.style.display='none';return}tipEl.textContent=s;tipEl.style.display='block';
 tipEl.style.left=Math.min(W-tipEl.offsetWidth-8,e.clientX+12)+'px';tipEl.style.top=(e.clientY+14)+'px';}

// ---------- timeline ----------
const tlc=document.getElementById('tlc'),tx=tlc.getContext('2d');let tlW,tlH,tlPos=[];
const t0=new Date(T[0].start).getTime()-90*864e5,t1=new Date(T[T.length-1].end).getTime()+90*864e5;
function tlResize(){tlW=tlc.clientWidth;tlH=tlc.clientHeight;tlc.width=tlW*DPR;tlc.height=tlH*DPR;tx.setTransform(DPR,0,0,DPR,0,0);tlDraw();}
function tlDraw(){if(!tlW)return;tx.clearRect(0,0,tlW,tlH);const pad=18,X=d=>pad+(new Date(d).getTime()-t0)/(t1-t0)*(tlW-2*pad),mid=tlH*.42;
 tx.strokeStyle='rgba(255,255,255,.15)';tx.beginPath();tx.moveTo(pad,mid);tx.lineTo(tlW-pad,mid);tx.stroke();
 tx.font='10px -apple-system,sans-serif';tx.fillStyle=css('--dim');tx.textAlign='center';
 for(let y=new Date(t0).getFullYear()+1;y<=new Date(t1).getFullYear();y++){const x=X(y+'-01-01');tx.fillRect(x,mid-4,1,8);tx.fillText(y,x,tlH-8);}
 tlPos=T.map((t,i)=>{const x=X(t.start),r=Math.max(2.5,Math.min(9,Math.sqrt(t.count)*.75));const on=i===cur&&!showAll,past=showAll||i<=cur;
  tx.globalAlpha=past?1:.35;tx.fillStyle=col(t.type);tx.beginPath();tx.arc(x,mid,on?r+2:r,0,7);tx.fill();
  if(on){tx.strokeStyle='#fff';tx.lineWidth=1.5;tx.stroke();}tx.globalAlpha=1;return{x,i};});}
tlc.addEventListener('click',e=>{const r=tlc.getBoundingClientRect(),x=e.clientX-r.left;let b=null,bd=1e9;for(const p of tlPos){const d=Math.abs(p.x-x);if(d<bd){bd=d;b=p.i}}if(b!=null){pause();go(b)}});
tlc.addEventListener('mousemove',e=>{const r=tlc.getBoundingClientRect(),x=e.clientX-r.left;let b=null,bd=12;for(const p of tlPos){const d=Math.abs(p.x-x);if(d<bd){bd=d;b=p.i}}
 tip(b!=null?T[b].title+' · '+T[b].count+' photos':null,e);});tlc.addEventListener('mouseleave',()=>tip(null));

addEventListener('resize',resize);resize();requestAnimationFrame(draw);
window.go=go;window.pause=pause;window.finale=finale;}
</script></body></html>
